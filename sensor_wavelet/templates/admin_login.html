<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        /* Reset and base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e0f7fa;
            padding: 20px;
            animation: fadeIn 1s ease forwards;
        }

        h2 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            animation: bounce 2.5s infinite ease-in-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                color: #81d4fa;
                text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            }
            50% {
                transform: translateY(-20px);
                color: #4fc3f7;
                text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            background: rgba(0, 0, 0, 0.45);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 105, 255, 0.6);
            display: flex;
            flex-direction: column;
            width: 320px;
            gap: 25px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 1.1rem;
            box-shadow: inset 0 0 8px rgba(0, 150, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            color: #eef9ff;
            transition: box-shadow 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            box-shadow: inset 0 0 12px rgba(0, 200, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
        }

        button[type="submit"] {
            background: linear-gradient(270deg, #ff6a00, #ee0979, #ff6a00);
            background-size: 600% 600%;
            padding: 15px 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 105, 135, 0.6);
            animation: gradientShift 8s ease infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
            filter: drop-shadow(0 0 5px #ff6a00);
        }

        button[type="submit"]:hover {
            box-shadow: 0 12px 32px rgba(255, 105, 135, 0.9);
            transform: scale(1.1);
            animation-play-state: paused;
            filter: drop-shadow(0 0 12px #ee0979);
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .error {
            color: #ff6b6b;
            font-weight: 700;
            text-align: center;
            font-size: 1rem;
            margin-bottom: -15px;
        }

        .home-link {
            margin-top: 35px;
            font-weight: 600;
            font-size: 1rem;
            color: #81d4fa;
            text-decoration: none;
            transition: color 0.3s ease;
            user-select: none;
        }

        .home-link:hover {
            color: #4fc3f7;
            text-shadow: 0 0 8px #4fc3f7;
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            form {
                width: 90vw;
                padding: 40px 25px;
            }

            h2 {
                font-size: 2.3rem;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <h2>🔐 Admin Login</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" novalidate>
        {% csrf_token %}
        <input type="text" name="admin_id" placeholder="Admin ID" required autofocus />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>
    <a href="{% url 'index' %}" class="home-link">← Home Page</a>
</body>
</html>
