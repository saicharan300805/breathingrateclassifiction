<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
            color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
            animation: fadeIn 1s ease forwards;
        }

        h2 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                color: #81d4fa;
                text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            }
            50% {
                transform: translateY(-20px);
                color: #4fc3f7;
                text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard container as flex wrap grid */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        /* Module card style */
        .module {
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 30px rgba(0, 105, 255, 0.6);
            border-radius: 20px;
            padding: 30px 25px;
            width: 250px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            user-select: none;
            color: #e0f7fa;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .module:hover {
            box-shadow: 0 12px 40px rgba(0, 160, 255, 1);
            transform: scale(1.08);
            color: #81d4fa;
        }

        /* Module icon */
        .module span.icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 6px #4fc3f7);
        }

        /* Anchor styling to cover whole module */
        .module a {
            color: inherit;
            text-decoration: none;
            display: block;
            height: 100%;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .dashboard {
                gap: 20px;
            }
            .module {
                width: 90%;
                padding: 25px 20px;
                font-size: 1rem;
            }
            h2 {
                font-size: 2.4rem;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <h2>Welcome, Admin!</h2>
    <div class="dashboard">
        <div class="module" tabindex="0">
            <a href="{% url 'admin_upload_dataset' %}">
                <span class="icon">📁</span>
                Upload & Train Dataset
            </a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'view_all_users' %}">
                <span class="icon">👤</span>
                View All Users
            </a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'view_all_predictions' %}">
                <span class="icon">📊</span>
                View All Predictions
            </a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'view_trained_models' %}">
                <span class="icon">📦</span>
                View Trained Models
            </a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'admin_logout' %}">
                <span class="icon">🚪</span>
                Logout
            </a>
        </div>
    </div>
</body>
</html>
