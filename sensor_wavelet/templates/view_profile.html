<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Profile</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
        color: #e0f7fa;
        padding: 60px 20px 40px;
        text-align: center;
        animation: fadeIn 1s ease forwards;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h2 {
        font-size: 3rem;
        margin-bottom: 40px;
        text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        animation: bounce 2.5s infinite ease-in-out;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            color: #81d4fa;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        }
        50% {
            transform: translateY(-20px);
            color: #4fc3f7;
            text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
    }

    .profile-container {
        background: rgba(0, 0, 0, 0.55);
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 0 32px rgba(0, 105, 255, 0.7);
        max-width: 440px;
        width: 100%;
        text-align: left;
        user-select: none;
    }

    p {
        font-size: 1.25rem;
        margin: 15px 0;
        line-height: 1.6;
        color: #cce9ff;
        font-weight: 500;
    }

    p strong {
        color: #81d4fa;
    }

    a.back-link {
        display: inline-block;
        margin-top: 35px;
        padding: 12px 30px;
        color: #81d4fa;
        font-weight: 700;
        border-radius: 50px;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
        text-decoration: none;
        transition: color 0.3s ease, box-shadow 0.3s ease;
        user-select: none;
    }

    a.back-link:hover {
        color: #4fc3f7;
        box-shadow: 0 0 32px #4fc3f7;
    }

    /* Responsive */
    @media (max-width: 480px) {
        h2 {
            font-size: 2.4rem;
            margin-bottom: 30px;
        }

        .profile-container {
            padding: 30px 25px;
            max-width: 90vw;
        }

        p {
            font-size: 1rem;
            margin: 12px 0;
        }
    }
</style>
</head>
<body>
    <h2>Your Profile</h2>
    <div class="profile-container">
        <p><strong>Name:</strong> {{ profile.name }}</p>
        <p><strong>Email:</strong> {{ profile.email }}</p>
        <p><strong>Phone:</strong> {{ profile.phone }}</p>
        <p><strong>DOB:</strong> {{ profile.dob }}</p>
        <p><strong>State:</strong> {{ profile.state }}</p>
    </div>
    <a href="{% url 'user_dashboard' %}" class="back-link">⬅️ Back to Dashboard</a>
</body>
</html>
