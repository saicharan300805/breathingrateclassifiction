<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome | Breathing Rate Classifier</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        /* Reset and base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e0f7fa;
            overflow: hidden;
            padding: 20px;
        }

        /* Bouncing heading animation */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 60px;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                color: #81d4fa;
                text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            }
            50% {
                transform: translateY(-20px);
                color: #4fc3f7;
                text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
            }
        }

        /* Container for buttons */
        .btn-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* Animated gradient buttons */
        .button {
            padding: 18px 48px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(270deg, #ff6a00, #ee0979, #ff6a00);
            background-size: 600% 600%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 105, 135, 0.6);
            transition: box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: gradientShift 8s ease infinite;
            user-select: none;
            filter: drop-shadow(0 0 5px #ff6a00);
            position: relative;
            overflow: hidden;
        }

        .button:hover {
            box-shadow: 0 12px 32px rgba(255, 105, 135, 0.9);
            transform: scale(1.1);
            animation-play-state: paused;
            filter: drop-shadow(0 0 12px #ee0979);
        }

        /* Gradient animation on buttons */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Icon spacing */
        .button span.icon {
            margin-right: 10px;
            font-size: 1.4rem;
        }

        /* Footer text scroll alternative to marquee with smooth fade in out */
        .footer-text {
            position: fixed;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: #bbdefb;
            font-weight: 500;
            animation: footerFade 6s linear infinite alternate;
            user-select: none;
            letter-spacing: 0.05em;
            font-style: italic;
        }

        @keyframes footerFade {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Responsive scaling */
        @media (max-width: 500px) {
            h1 {
                font-size: 2.5rem;
                margin-bottom: 40px;
            }

            .button {
                padding: 14px 36px;
                font-size: 1rem;
                border-radius: 40px;
            }

            .btn-container {
                gap: 25px;
            }
        }

    </style>
</head>
<body>
    <h1>🫁 Breathing Rate Classification System</h1>
    <div class="btn-container">
        <a href="{% url 'admin_login' %}" class="button"><span class="icon">🔐</span>Admin Login</a>
        <a href="{% url 'user_login' %}" class="button"><span class="icon">👤</span>User Login</a>
    </div>
    <div class="footer-text">B.PRASHANTH REDDY @E-CLS 2025</div>
</body>
</html>
