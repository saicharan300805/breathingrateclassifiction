<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prediction</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
        color: #e0f7fa;
        padding: 60px 20px 40px;
        text-align: center;
        animation: fadeIn 1s ease forwards;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h2 {
        font-size: 3rem;
        margin-bottom: 40px;
        text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        animation: bounce 2.5s infinite ease-in-out;
        user-select: none;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            color: #81d4fa;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        }
        50% {
            transform: translateY(-20px);
            color: #4fc3f7;
            text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
    }

    form {
        background: rgba(0, 0, 0, 0.55);
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 0 32px rgba(0, 105, 255, 0.7);
        max-width: 420px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 30px;
        user-select: none;
    }

    input[type="file"] {
        padding: 14px 18px;
        border-radius: 14px;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #e0f7fa;
        font-size: 1.1rem;
        box-shadow: inset 0 0 16px rgba(0, 150, 255, 0.5);
        cursor: pointer;
        transition: box-shadow 0.3s ease;
    }

    input[type="file"]:hover,
    input[type="file"]:focus {
        box-shadow: inset 0 0 24px rgba(0, 200, 255, 0.9);
        background: rgba(255, 255, 255, 0.15);
    }

    button {
        background: linear-gradient(270deg, #ff6a00, #ee0979, #ff6a00);
        background-size: 600% 600%;
        padding: 16px 0;
        font-size: 1.3rem;
        font-weight: 700;
        color: #fff;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(255, 105, 135, 0.7);
        animation: gradientShift 8s ease infinite;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        filter: drop-shadow(0 0 6px #ff6a00);
        user-select: none;
    }

    button:hover {
        box-shadow: 0 12px 38px rgba(255, 105, 135, 1);
        transform: scale(1.1);
        animation-play-state: paused;
        filter: drop-shadow(0 0 14px #ee0979);
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h3, h4 {
        margin-top: 40px;
        color: #81d4fa;
        text-shadow: 0 0 8px #4fc3f7;
        user-select: none;
    }

    img {
        margin-top: 20px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        max-width: 100%;
        max-height: 400px;
        object-fit: contain;
        user-select: none;
    }

    .back-link-container {
        margin-top: 45px;
        user-select: none;
    }

    a.back-link {
        font-weight: 600;
        font-size: 1.1rem;
        color: #81d4fa;
        text-decoration: none;
        padding: 12px 30px;
        border-radius: 50px;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 22px rgba(0, 150, 255, 0.6);
        transition: color 0.3s ease, box-shadow 0.3s ease;
        display: inline-block;
    }

    a.back-link:hover {
        color: #4fc3f7;
        box-shadow: 0 0 38px #4fc3f7;
    }

    /* Responsive */
    @media (max-width: 480px) {
        form {
            padding: 35px 25px;
        }
        h2 {
            font-size: 2.4rem;
            margin-bottom: 30px;
        }
        h3, h4 {
            font-size: 1.25rem;
            margin-top: 30px;
        }
        button {
            font-size: 1.1rem;
            padding: 14px 0;
        }
    }
</style>
</head>
<body>
    <h2>Upload Signal for Prediction</h2>
    <form method="POST" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <input type="file" name="signal_file" accept=".csv,.txt" required />
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h3>📈 Predicted Breathing Rate: {{ prediction }} bpm</h3>
    {% endif %}

    {% if signal_plot %}
        <h4>🔌 Raw Voltage Signal:</h4>
        <img src="data:image/png;base64,{{ signal_plot }}" alt="Raw Voltage Signal" />
    {% endif %}

    {% if cwt_image %}
        <h4>🌊 CWT Image:</h4>
        <img src="data:image/png;base64,{{ cwt_image }}" alt="CWT Image" />
    {% endif %}

    <div class="back-link-container">
        <a href="{% url 'user_dashboard' %}" class="back-link">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>
