<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>User Dashboard</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
        color: #e0f7fa;
        padding: 60px 20px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 1s ease forwards;
    }

    h2 {
        font-size: 3rem;
        margin-bottom: 50px;
        text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        animation: bounce 2.5s infinite ease-in-out;
        user-select: none;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            color: #81d4fa;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        }
        50% {
            transform: translateY(-20px);
            color: #4fc3f7;
            text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .dashboard {
        display: flex;
        flex-wrap: wrap;
        gap: 35px;
        justify-content: center;
        max-width: 900px;
        width: 100%;
    }

    .module {
        background: rgba(0, 0, 0, 0.5);
        border-radius: 20px;
        padding: 30px 25px;
        width: 250px;
        font-weight: 600;
        font-size: 1.25rem;
        color: #e0f7fa;
        box-shadow: 0 0 30px rgba(0, 105, 255, 0.6);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        cursor: pointer;
        user-select: none;
    }

    .module:hover {
        box-shadow: 0 0 45px rgba(0, 160, 255, 1);
        color: #81d4fa;
        transform: scale(1.1);
    }

    .module a {
        color: inherit;
        text-decoration: none;
        display: block;
        height: 100%;
        line-height: 1.3;
    }

    /* Responsive */
    @media (max-width: 600px) {
        .dashboard {
            gap: 25px;
        }
        .module {
            width: 90%;
            font-size: 1.1rem;
            padding: 25px 20px;
        }
        h2 {
            font-size: 2.4rem;
            margin-bottom: 35px;
        }
    }
</style>
</head>
<body>
    <h2>Welcome to Your Dashboard</h2>
    <div class="dashboard">
        <div class="module" tabindex="0">
            <a href="{% url 'view_profile' %}">👤 View Profile</a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'predict_signal' %}">📈 Prediction Page</a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'view_history' %}">📜 View Prediction History</a>
        </div>
        <div class="module" tabindex="0">
            <a href="{% url 'logout' %}">🔓 Logout</a>
        </div>
    </div>
</body>
</html>
