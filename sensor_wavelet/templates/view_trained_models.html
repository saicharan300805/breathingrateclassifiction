<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trained Models</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
        color: #e0f7fa;
        padding: 60px 20px 40px;
        text-align: center;
        animation: fadeIn 1s ease forwards;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h2 {
        font-size: 3rem;
        margin-bottom: 40px;
        text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        animation: bounce 2.5s infinite ease-in-out;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            color: #81d4fa;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
        }
        50% {
            transform: translateY(-20px);
            color: #4fc3f7;
            text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    ul.model-list {
        list-style: none;
        padding: 0;
        max-width: 600px;
        width: 100%;
        margin: 0 auto 30px;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    ul.model-list li {
        background: rgba(0, 0, 0, 0.45);
        padding: 18px 25px;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(0, 105, 255, 0.6);
        font-size: 1.2rem;
        font-weight: 600;
        color: #cce9ff;
        text-transform: capitalize;
        user-select: none;
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    ul.model-list li:hover {
        background: rgba(0, 60, 130, 0.7);
        box-shadow: 0 0 40px rgba(0, 160, 255, 0.9);
        cursor: default;
    }

    ul.model-list li.empty-message {
        background: transparent;
        box-shadow: none;
        font-style: italic;
        font-weight: 500;
        color: #99badd;
    }

    .back-container {
        margin-top: 25px;
        user-select: none;
    }

    a.back-link {
        font-weight: 600;
        font-size: 1.1rem;
        color: #81d4fa;
        text-decoration: none;
        padding: 10px 25px;
        border-radius: 40px;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
        transition: color 0.3s ease, box-shadow 0.3s ease;
        display: inline-block;
    }

    a.back-link:hover {
        color: #4fc3f7;
        box-shadow: 0 0 32px #4fc3f7;
    }

    /* Responsive */
    @media (max-width: 480px) {
        h2 {
            font-size: 2.4rem;
            margin-bottom: 30px;
        }
        ul.model-list li {
            font-size: 1rem;
            padding: 14px 18px;
            border-radius: 12px;
        }
    }
</style>
</head>
<body>
    <h2>Trained CNN Models</h2>
    <ul class="model-list">
        {% for m in models %}
            <li>{{ m }}</li>
        {% empty %}
            <li class="empty-message">No models found.</li>
        {% endfor %}
    </ul>
    <div class="back-container">
        <a href="{% url 'admin_dashboard' %}" class="back-link">⬅️ Back to Dashboard</a>
    </div>
</body>
</html>
