<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Upload Dataset & Train</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e3c72, #2a5298, #1e3c72);
            color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
            animation: fadeIn 1s ease forwards;
            text-align: center;
        }

        h2 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                color: #81d4fa;
                text-shadow: 0 4px 15px rgba(0, 150, 255, 0.7);
            }
            50% {
                transform: translateY(-20px);
                color: #4fc3f7;
                text-shadow: 0 6px 20px rgba(0, 200, 255, 1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        form {
            background: rgba(0, 0, 0, 0.55);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 105, 255, 0.6);
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            font-size: 1.1rem;
            text-align: left;
            color: #b3d9ff;
        }

        input[type="file"] {
            padding: 12px 10px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: #e0f7fa;
            box-shadow: inset 0 0 10px rgba(0, 150, 255, 0.4);
            cursor: pointer;
            font-size: 1rem;
            transition: box-shadow 0.3s ease;
        }

        input[type="file"]:hover,
        input[type="file"]:focus {
            box-shadow: inset 0 0 16px rgba(0, 200, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            background: linear-gradient(270deg, #ff6a00, #ee0979, #ff6a00);
            background-size: 600% 600%;
            padding: 15px 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 105, 135, 0.6);
            animation: gradientShift 8s ease infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            filter: drop-shadow(0 0 5px #ff6a00);
            user-select: none;
        }

        button:hover {
            box-shadow: 0 12px 32px rgba(255, 105, 135, 0.9);
            transform: scale(1.1);
            animation-play-state: paused;
            filter: drop-shadow(0 0 12px #ee0979);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        p.message {
            font-weight: 700;
            font-size: 1.2rem;
            max-width: 420px;
            margin: 0 auto 20px;
            color: #a2f5a2; /* default green */
        }

        p.message.failed {
            color: #ff6b6b;
        }

        p.accuracy {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 6px #4fc3f7;
        }

        a.back-link {
            font-weight: 600;
            font-size: 1rem;
            color: #81d4fa;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            transition: color 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
            display: inline-block;
            margin-top: 10px;
        }

        a.back-link:hover {
            color: #4fc3f7;
            box-shadow: 0 0 32px #4fc3f7;
        }

        /* Responsive */
        @media (max-width: 460px) {
            form {
                padding: 30px 25px;
                width: 90vw;
            }
            p.message, p.accuracy {
                font-size: 1rem;
                max-width: 90vw;
            }
            h2 {
                font-size: 2.4rem;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <h2>📁 Upload Dataset for Model Training</h2>

    <form method="POST" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <label for="dataset_file">Select Dataset File (.csv):</label>
        <input type="file" name="dataset_file" id="dataset_file" accept=".csv" required />
        <button type="submit">Upload & Train</button>
    </form>

    {% if message %}
        <p class="message {% if 'failed' in message %}failed{% endif %}">
            {{ message }}
        </p>
    {% endif %}

    {% if accuracy %}
        <p class="accuracy">🎯 <strong>Accuracy:</strong> {{ accuracy }}%</p>
    {% endif %}

    <a href="{% url 'admin_dashboard' %}" class="back-link">⬅️ Back to Dashboard</a>
</body>
</html>
